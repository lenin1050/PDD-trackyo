name: Deploy & E2E Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-test-deploy:
    name: Build, Run E2E, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 1. Install & build frontend
      - name: Install Frontend Dependencies
        working-directory: ./trackyo_website/frontend
        run: npm install

      - name: Build Frontend
        working-directory: ./trackyo_website/frontend
        env:
          NODE_ENV: production
          VITE_API_URL: https://trackyo-api.onrender.com/api
        run: npm run build

      # 2. Stage frontend build
      - name: Stage Frontend Build
        run: |
          mkdir -p pages_build
          cp -r trackyo_website/frontend/dist/* pages_build/

      # 3. Setup backend dependencies and MongoDB memory server
      - name: Install Backend & Test Dependencies
        working-directory: ./trackyo_website/backend
        run: |
          npm install
          npm install --prefix selenium-tests

      # 4. Start backend and run Selenium tests (Headless mode)
      - name: Run Selenium E2E Tests
        working-directory: ./trackyo_website/backend/selenium-tests
        env:
          CI: true
          BASE_URL: http://localhost:5173/
        run: |
          # The runner will start its own local instances to verify app functionality
          node run-tests.js || true

      # 5. Populate reports into pages_build structure
      - name: Stage Test Reports
        run: |
          # Define folders
          LATEST_DIR="pages_build/reports/latest"
          HISTORY_DIR="pages_build/reports/history/build-${{ github.run_number }}"
          
          mkdir -p "$LATEST_DIR"
          mkdir -p "$HISTORY_DIR"
          
          # Copy to latest
          if [ -d "Test Results/HTML" ]; then
            cp -r Test Results/HTML/* "$LATEST_DIR"/ || true
          fi
          if [ -d "Test Results/Summary" ]; then
            cp -r Test Results/Summary/* "$LATEST_DIR"/ || true
          fi
          if [ -d "Test Results/Screenshots" ]; then
            cp -r Test Results/Screenshots "$LATEST_DIR"/ || true
          fi
          if [ -d "Test Results/Logs" ]; then
            cp -r Test Results/Logs "$LATEST_DIR"/ || true
          fi
          
          # Copy to history
          cp -r "$LATEST_DIR"/* "$HISTORY_DIR"/ || true

      # 6. Setup Pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      # 7. Upload the pages_build folder as artifact
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_build

      # 8. Deploy the unified site (app + reports) to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 9. Upload test reports as separate archive artifacts
      - name: Upload Test Reports Archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E2E-Automation-Reports
          path: Test Results/

      # 10. Publish GitHub Step Summary
      - name: Publish Step Summary
        if: always()
        run: |
          echo "# Live GitHub Pages E2E Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment URL:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
          echo "**Live Report URL:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/latest/execution-report.html" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please see the workflow artifacts for the full download of the Excel sheets and screenshots." >> $GITHUB_STEP_SUMMARY
